; Example only. Paste the route in Dialplan; common contexts are generated separately.
; Worker must supply ZV2_LIST_ID. Change 7305 in BOTH route and START audit for another prefix.
exten => _7305X.,1,NoOp(Bot IVR CARSA)
 same => n,GotoIf($["${ZV2_LIST_ID}" = ""]?fallo)
 same => n,Set(__ZV2_LIST_ID=${ZV2_LIST_ID})
 same => n,Set(__ZV2_PHONE=${EXTEN:4})
 same => n,Set(__ZV2_CALL_ID=${UNIQUEID})
 same => n,Set(AGISIGHUP=no)
 same => n,AGI(/srv/www/htdocs/zynervoxv2/bot_ivr/call_tracking_agi.php,start,${ZV2_LIST_ID},${ZV2_PHONE},${ZV2_CALL_ID},7305,carrier1,${CHANNEL(linkedid)})
 same => n,GotoIf($["${ZV2_TRACK_OK}" != "1"]?fallo)
 same => n,Set(__ZV2_LEAD_ID=${ZV2_LEAD_ID})
 same => n,Set(CHANNEL(hangup_handler_push)=zynervoxv2-call-finish,s,1)
 same => n,Dial(SIP/carrier1/881851${ZV2_PHONE},60,b(zynervoxv2-outbound^s^1)U(zynervoxv2-bot-ivr))
 same => n,Hangup()
 same => n(fallo),Hangup()
; For the second route use another prefix and U(zynervoxv2-bot-ivr-sin-amd).
