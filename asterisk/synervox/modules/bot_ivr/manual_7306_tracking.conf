; Manual calls: list 1. Future worker must set ZV2_LIST_ID explicitly.
[zynervoxv2]
exten => _7306X.,1,NoOp(Llamada manual v2 con seguimiento)
 same => n,ExecIf($["${ZV2_LIST_ID}" = ""]?Set(ZV2_LIST_ID=1))
 same => n,Set(ZV2_PHONE=${EXTEN:4})
 same => n,Set(__ZV2_CALL_ID=${UNIQUEID})
 same => n,Set(AGISIGHUP=no)
 same => n,AGI(/srv/www/htdocs/zynervoxv2/bot_ivr/call_tracking_agi.php,start,${ZV2_LIST_ID},${ZV2_PHONE},${ZV2_CALL_ID},7306,carrier1,${CHANNEL(linkedid)})
 same => n,GotoIf($["${ZV2_TRACK_OK}" != "1"]?fallo)
 same => n,Set(CHANNEL(hangup_handler_push)=zynervoxv2-call-finish,s,1)
 same => n,Dial(SIP/carrier1/881851${ZV2_PHONE},60,b(zynervoxv2-outbound^s^1)U(zynervoxv2-amd))
 same => n,Hangup()
 same => n(fallo),Hangup()
