services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    env_file: .env
    environment:
      MYSQL_DATABASE: ${WHATSAPP_DB_NAME}
      MYSQL_USER: ${WHATSAPP_DB_USER}
      MYSQL_PASSWORD: ${WHATSAPP_DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${WHATSAPP_DB_ROOT_PASSWORD}
    volumes:
      - whatsapp_mysql:/var/lib/mysql
      - ./init/001-schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  app:
    image: ${ZYNERWABA_IMAGE}
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      HOST: 0.0.0.0
      PORT: 3021
      BASE_PATH: ${WHATSAPP_BASE_PATH}
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${WHATSAPP_DB_NAME}
      DB_USER: ${WHATSAPP_DB_USER}
      DB_PASSWORD: ${WHATSAPP_DB_PASSWORD}
      INITIAL_ADMIN_USER: ${WHATSAPP_ADMIN_USER}
      INITIAL_ADMIN_PASSWORD: ${WHATSAPP_ADMIN_PASSWORD}
      SESSION_SECRET: ${WHATSAPP_SESSION_SECRET}
      CREDENTIALS_KEY: ${WHATSAPP_CREDENTIALS_KEY}
      ZYNERVOX_SSO_SECRET: ${ZYNERVOX_SSO_SECRET}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${WHATSAPP_BIND}:${WHATSAPP_PORT}:3021"
    volumes:
      - whatsapp_data:/app/data

volumes:
  whatsapp_mysql:
  whatsapp_data:
