<!doctype html>
<html lang="es">
<head>
  <base href="__APP_BASE__/">
  <script>window.__APP_BASE__ = '__APP_BASE__';</script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Empresas · Zynerwaba</title>
  <style>
    :root{font-family:Segoe UI,Arial,sans-serif;color:#252733;background:#f4f5f7;--orange:#f58a1f;--green:#16803c;--red:#b42318}*{box-sizing:border-box}body{margin:0}header{padding:16px 24px;background:#30313c;color:#fff;display:flex;align-items:center;justify-content:space-between;gap:20px}.header-actions,.header-nav{display:flex;align-items:center;gap:14px}.header-nav a{color:#fff}.logout-btn{background:transparent;border:1px solid #ffffff66;color:#fff}main{max-width:1100px;margin:24px auto;padding:0 18px}.card{background:#fff;border-radius:14px;padding:18px;margin-bottom:18px;border-top:4px solid var(--orange)}form{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}input,select,textarea,button{font:inherit;padding:9px;border:1px solid #d9dce2;border-radius:8px}button{background:var(--orange);color:#fff;border:0;cursor:pointer;font-weight:600}button:disabled{cursor:wait;opacity:.62}button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid #ffc77f;outline-offset:2px}.company{display:grid;grid-template-columns:1fr auto;gap:12px;padding:14px 0;border-bottom:1px solid #e5e7eb}.bad{color:var(--red)}.ok{color:var(--green)}.muted{color:#68707d;font-size:13px}.hidden{display:none!important}dialog{border:0;border-radius:14px;max-width:650px;width:90%}dialog::backdrop{background:#0008}.numbers-panel{margin-top:12px;padding:14px;background:#f8f9fb;border:1px solid #e5e7eb;border-radius:10px}.numbers-heading{display:flex;justify-content:space-between;gap:12px}.line-list{display:grid;gap:8px;margin:12px 0 16px}.line-row{display:grid;grid-template-columns:minmax(180px,1.3fr) minmax(170px,1fr) auto auto;align-items:center;gap:12px;padding:11px 12px;background:#fff;border:1px solid #dfe2e8;border-left:4px solid var(--line-color);border-radius:8px}.line-name{display:flex;align-items:center;gap:9px}.line-swatch{width:12px;height:12px;border-radius:3px;background:var(--line-color);box-shadow:0 0 0 1px #0002}.line-meta{font-size:12px;color:#68707d}.status{font-size:12px;font-weight:700}.status-active{color:var(--green)}.status-inactive{color:#68707d}.secondary{background:#fff;color:#3d414d;border:1px solid #cfd3da}.edit-form{grid-column:1/-1;grid-template-columns:1.2fr 1.2fr 80px 135px auto;align-items:end;padding-top:10px;border-top:1px solid #eceef2}.field{display:grid;gap:5px}.field span{font-size:12px;font-weight:700;color:#545b68}.form-actions{display:flex;gap:7px}.new-line{padding-top:14px;border-top:1px solid #dfe2e8}.new-line h4{margin:0 0 9px}.panel-message{min-height:18px;margin-top:7px}@media(max-width:760px){header{align-items:flex-start}.header-actions{align-items:flex-end;flex-direction:column}.company{grid-template-columns:1fr}.line-row{grid-template-columns:1fr auto}.line-id{grid-column:1/-1}.edit-form{grid-template-columns:1fr}}
    header>strong,.header-nav a,.logout-btn{white-space:nowrap}.company{position:relative;padding:18px 14px;margin:0 -6px;border-radius:10px}.company:hover{background:#fafbfc}.company-actions{display:flex;flex-wrap:wrap;justify-content:flex-end;align-content:flex-start;gap:7px}.company-actions button{background:#fff;color:#343844;border:1px solid #ccd1d9}.company-actions button:hover{border-color:var(--orange);color:#a94f00}.company-actions .danger{color:var(--red);border-color:#efc2be}.company-actions .danger:hover{background:#fff4f3;border-color:var(--red);color:var(--red)}.company-summary{display:grid;gap:3px}.line-columns{display:grid;grid-template-columns:minmax(180px,1.3fr) minmax(170px,1fr) auto 70px;gap:12px;padding:0 12px;color:#68707d;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em}.line-row.is-editing{border-color:#efad67;background:#fffaf4;box-shadow:0 0 0 2px #f58a1f20}.line-row.is-editing>.line-name,.line-row.is-editing>.line-id,.line-row.is-editing>.status,.line-row.is-editing>.edit-trigger{display:none}.line-row.is-editing .edit-form{display:grid!important}
    .line-row.is-editing>button.secondary{display:none}@media(max-width:760px){header{display:grid;grid-template-columns:1fr;padding:14px 16px}.header-actions{width:100%;flex-direction:row;justify-content:space-between;align-items:center;gap:8px}.header-nav{gap:12px}.company-actions{display:grid;grid-template-columns:1fr 1fr}.company-actions button{width:100%}.line-columns{display:none}}
  </style>
</head>
<body>
<header><strong>Zynerwaba · Empresas</strong><div class="header-actions"><nav class="header-nav" aria-label="Navegación principal"><a href="salud">Salud global</a><a href="">Volver</a></nav><button class="logout-btn" id="logoutButton" type="button">Cerrar sesión</button></div></header>
<main>
  <section class="card"><h2>Nueva empresa</h2><form id="createForm"><label class="field"><span>Nombre</span><input name="nombre" placeholder="Ej. Comercial Andina" required></label><label class="field"><span>Slug</span><input name="slug" placeholder="comercial-andina" pattern="[a-z0-9]+(?:-[a-z0-9]+)*" required></label><label class="field"><span>Correo</span><input name="contacto_email" type="email" placeholder="admin@empresa.com"></label><label class="field"><span>Teléfono</span><input name="contacto_telefono" placeholder="+51 999 999 999"></label><label class="field"><span>Plan</span><input name="plan" value="basico"></label><button>Crear</button></form></section>
  <section class="card"><h2>Empresas</h2><div id="companies"></div></section>
</main>
<dialog id="credentials"><form method="dialog" id="credentialsForm"><h2>Reemplazar credenciales</h2><input name="empresa_id" type="hidden"><p class="muted">Los secretos no se pueden consultar. Deja vacío un campo para conservarlo; cualquier valor escrito lo reemplaza cifrado.</p><label class="field"><span>WABA ID</span><input name="waba_id"></label><label class="field"><span>App ID</span><input name="app_id" placeholder="Necesario para plantillas con imagen"></label><label class="field"><span>Phone Number ID</span><input name="phone_number_id"></label><label class="field"><span>Versión Graph</span><input name="graph_version" value="v25.0"></label><label class="field"><span>Access token</span><input name="access_token" type="password"></label><label class="field"><span>App secret</span><input name="app_secret" type="password"></label><label class="field"><span>Verify token</span><input name="verify_token" type="password"></label><button value="cancel">Cancelar</button><button id="saveCredentials" value="default">Guardar cifrado</button></form></dialog>
<script>
const BASE=window.__APP_BASE__, companies=document.querySelector('#companies');
const escapeHtml=value=>String(value??'').replace(/[&<>'"]/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[char]));
const safeColor=value=>/^#[0-9a-f]{6}$/i.test(String(value||''))?String(value):'#25d366';
// `empresaId` viaja como cabecera X-Empresa-Id: es la forma en que el superadmin
// opera dentro de una empresa concreta sin salir de este panel.
async function api(path,options={},empresaId){const headers={'Content-Type':'application/json',...(empresaId?{'X-Empresa-Id':String(empresaId)}:{})};const response=await fetch(BASE+'/api'+path,{headers,...options});const data=await response.json().catch(()=>({}));if(!response.ok)throw new Error(data.error||'Error');return data}
async function load(){const rows=await api('/empresas');companies.innerHTML=rows.map(raw=>{const e={...raw,id:Number(raw.id),nombre:escapeHtml(raw.nombre),estado:escapeHtml(raw.estado),slug:escapeHtml(raw.slug),lineas:Number(raw.lineas)||0,usuarios:Number(raw.usuarios)||0,credenciales_estado:escapeHtml(raw.credenciales_estado),access_token_hint:escapeHtml(raw.access_token_hint)};const active=raw.estado==='activa';return `<article class="company"><div class="company-summary"><div><strong>${e.nombre}</strong> <span class="${active?'ok':'bad'}">${e.estado}</span></div><div class="muted">${e.slug} · ${e.lineas} líneas · ${e.usuarios} usuarios · credenciales ${e.credenciales_estado}${e.access_token_hint?' · ••••'+e.access_token_hint:''}</div><div class="muted">Protección de salud: <strong>${raw.salud_corte_automatico?'corte automático':'solo aviso'}</strong></div><div id="panel-${e.id}"></div></div><div class="company-actions" aria-label="Acciones de ${e.nombre}"><button onclick="credentials(${e.id})">Credenciales</button><button onclick="numeros(${e.id})">Números</button><button onclick="usuarios(${e.id})">Administradores</button><button onclick="healthCut(${e.id},${raw.salud_corte_automatico?0:1})">${raw.salud_corte_automatico?'Usar solo aviso':'Activar corte'}</button><button class="${active?'danger':''}" onclick="toggle(${e.id},'${active?'suspendida':'activa'}')">${active?'Suspender':'Reactivar'}</button></div></article>`}).join('')}

/* ---- Números (líneas) de la empresa ---- */
window.numeros=async id=>{
  const box=document.querySelector('#panel-'+id);
  if(box.dataset.open==='numeros'){box.innerHTML='';box.dataset.open='';return}
  box.dataset.open='numeros';
  try{
    const lineas=await api('/empresas/'+id+'/lines');
    box.innerHTML=`<section class="numbers-panel" aria-labelledby="numbers-title-${id}"><div class="numbers-heading"><div><strong id="numbers-title-${id}">Números de WhatsApp</strong><div class="muted">Líneas registradas para esta empresa.</div></div><span class="muted">${lineas.length} ${lineas.length===1?'línea':'líneas'}</span></div><div class="line-list">${lineas.length?lineas.map(l=>lineRow(l,id)).join(''):'<div class="muted">Todavía no hay números registrados.</div>'}</div><div class="new-line"><h4>Añadir número</h4><form onsubmit="crearLinea(event,${id})"><label class="field"><span>Nombre</span><input name="name" placeholder="Ej. Línea Perú" maxlength="50" required></label><label class="field"><span>Phone Number ID</span><input name="phone_number_id" placeholder="Solo dígitos" inputmode="numeric" pattern="\\d{5,20}" required></label><label class="field"><span>Color</span><input name="color" type="color" value="#25d366"></label><button>Añadir número</button></form></div><div class="panel-message muted" id="msg-num-${id}" role="status" aria-live="polite"></div></section>`;
  }catch(e){box.innerHTML='<div class="bad">'+e.message+'</div>'}
};
function lineRow(line,empresaId){const id=Number(line.id),color=safeColor(line.color),name=escapeHtml(line.name),phone=escapeHtml(line.phone_number_id),contacts=Number(line.contact_count??0),agents=Number(line.agent_count??0);return `<article class="line-row" id="line-${empresaId}-${id}" style="--line-color:${color}"><div class="line-name"><span class="line-swatch" aria-hidden="true"></span><div><strong>${name}</strong><div class="line-meta">${contacts} contactos · ${agents} agentes</div></div></div><div class="line-id"><span class="line-meta">Phone Number ID</span><br><code>${phone}</code></div><span class="status ${line.active?'status-active':'status-inactive'}">${line.active?'Activa':'Inactiva'}</span><button type="button" class="secondary" onclick="editarLinea(${empresaId},${id})">Editar</button><form class="edit-form hidden" onsubmit="guardarLinea(event,${empresaId},${id})"><label class="field"><span>Nombre</span><input name="name" value="${name}" maxlength="50" required></label><label class="field"><span>Phone Number ID</span><input name="phone_number_id" value="${phone}" inputmode="numeric" pattern="\\d{5,20}" required></label><label class="field"><span>Color</span><input name="color" type="color" value="${color}"></label><label class="field"><span>Estado</span><select name="active"><option value="true" ${line.active?'selected':''}>Activa</option><option value="false" ${line.active?'':'selected'}>Inactiva</option></select></label><div class="form-actions"><button type="submit">Guardar</button><button type="button" class="secondary" onclick="cancelarEdicion(${empresaId},${id})">Cancelar</button></div><div class="bad panel-message" style="grid-column:1/-1" role="alert"></div></form></article>`}
window.editarLinea=(empresaId,id)=>{document.querySelectorAll('.line-row.is-editing').forEach(row=>row.classList.remove('is-editing'));const row=document.querySelector(`#line-${empresaId}-${id}`);row.classList.add('is-editing');row.querySelector('.edit-form input').focus()};
window.cancelarEdicion=(empresaId,id)=>{const row=document.querySelector(`#line-${empresaId}-${id}`);row.classList.remove('is-editing');row.querySelector(':scope > button.secondary').focus()};
window.guardarLinea=async(event,empresaId,id)=>{event.preventDefault();const form=event.target,buttons=form.querySelectorAll('button'),error=form.querySelector('[role="alert"]'),raw=Object.fromEntries(new FormData(form));raw.active=raw.active==='true';error.textContent='';buttons.forEach(b=>b.disabled=true);try{await api('/empresas/'+empresaId+'/lines/'+id,{method:'PATCH',body:JSON.stringify(raw)});const box=document.querySelector('#panel-'+empresaId);box.dataset.open='';await numeros(empresaId);await load()}catch(e){error.textContent=e.message;buttons.forEach(b=>b.disabled=false)}};
window.crearLinea=async(event,id)=>{
  event.preventDefault();
  const body=Object.fromEntries(new FormData(event.target));
  try{await api('/empresas/'+id+'/lines',{method:'POST',body:JSON.stringify(body)});document.querySelector('#panel-'+id).dataset.open='';await numeros(id);load()}
  catch(e){document.querySelector('#msg-num-'+id).innerHTML='<span class="bad">'+e.message+'</span>'}
};

/* ---- Usuarios de la empresa ---- */
window.usuarios=async id=>{
  const box=document.querySelector('#panel-'+id);
  if(box.dataset.open==='usuarios'){box.innerHTML='';box.dataset.open='';return}
  box.dataset.open='usuarios';
  try{
    const users=await api('/empresas/'+id+'/admins');
    box.innerHTML=`<div style="margin-top:10px;padding:12px;background:#f8f9fb;border:1px solid #e5e7eb;border-radius:10px">
      <strong>Administradores de empresa</strong>
      <div class="muted" style="margin:4px 0 8px">El superadministrador crea los administradores iniciales. Cada administrador gestiona después los operadores y recursos de su propia empresa.</div>
      ${users.length?users.map(u=>adminRow(u,id)).join(''):'<div class="muted">Todavía no hay administradores.</div>'}
      <form onsubmit="crearUsuario(event,${id})" style="margin-top:10px">
        <label class="field"><span>Usuario</span><input name="username" placeholder="usuario" pattern="[a-zA-Z0-9._-]{3,40}" required></label>
        <label class="field"><span>Nombre visible</span><input name="display_name" required></label>
        <label class="field"><span>Contraseña</span><input name="password" type="password" placeholder="Mínimo 8 caracteres" minlength="8" required></label>
        <input name="role" type="hidden" value="admin">
        <button>Crear administrador</button>
      </form><div class="muted" id="msg-usr-${id}"></div></div>`;
  }catch(e){box.innerHTML='<div class="bad">'+e.message+'</div>'}
};
function adminRow(user,empresaId){const id=Number(user.id),username=escapeHtml(user.username),displayName=escapeHtml(user.display_name);return `<form onsubmit="guardarAdministrador(event,${empresaId},${id})" style="margin-top:10px;padding:10px;border:1px solid #e5e7eb;border-radius:8px"><div><strong>${username}</strong></div><label class="field"><span>Nombre visible</span><input name="display_name" value="${displayName}" required></label><label class="field"><span>Nueva contraseña</span><input name="password" type="password" minlength="8" placeholder="Dejar vacía para conservarla"></label><label class="field"><span>Estado</span><select name="active"><option value="true" ${user.active?'selected':''}>Activo</option><option value="false" ${user.active?'':'selected'}>Inactivo</option></select></label><button type="submit">Guardar cambios</button> <button type="button" class="danger" onclick="eliminarAdministrador(${empresaId},${id},'${username}')">Eliminar</button><div class="bad" role="alert"></div></form>`}
window.crearUsuario=async(event,id)=>{
  event.preventDefault();
  const form=event.target;
  const body=Object.fromEntries(new FormData(form));
  body.line_ids=[];
  try{await api('/empresas/'+id+'/admins',{method:'POST',body:JSON.stringify(body)});await load();await usuarios(id)}
  catch(e){document.querySelector('#msg-usr-'+id).innerHTML='<span class="bad">'+e.message+'</span>'}
};
window.guardarAdministrador=async(event,empresaId,userId)=>{event.preventDefault();const form=event.target,body=Object.fromEntries(new FormData(form)),error=form.querySelector('[role="alert"]');body.active=body.active==='true';if(!body.password)delete body.password;error.textContent='';try{await api('/empresas/'+empresaId+'/admins/'+userId,{method:'PATCH',body:JSON.stringify(body)});await load();await usuarios(empresaId)}catch(e){error.textContent=e.message}};
window.eliminarAdministrador=async(empresaId,userId,username)=>{if(!confirm('¿Eliminar al administrador '+username+'?'))return;try{await api('/empresas/'+empresaId+'/admins/'+userId,{method:'DELETE'});await load();await usuarios(empresaId)}catch(e){alert(e.message)}};
document.querySelector('#createForm').onsubmit=async e=>{e.preventDefault();const body=Object.fromEntries(new FormData(e.target));await api('/empresas',{method:'POST',body:JSON.stringify(body)});e.target.reset();load()};
window.credentials=id=>{const form=document.querySelector('#credentialsForm');form.reset();form.empresa_id.value=id;document.querySelector('#credentials').showModal()};
window.toggle=async(id,estado)=>{await api('/empresas/'+id,{method:'PATCH',body:JSON.stringify({estado})});load()};
window.healthCut=async(id,enabled)=>{if(enabled&&!confirm('El corte automático pausará campañas cuando Meta marque el número en rojo. ¿Activarlo?'))return;await api('/empresas/'+id,{method:'PATCH',body:JSON.stringify({salud_corte_automatico:Boolean(enabled)})});load()};
document.querySelector('#saveCredentials').onclick=async e=>{e.preventDefault();if(!confirm('¿Reemplazar las credenciales enviadas?'))return;const form=document.querySelector('#credentialsForm'),raw=Object.fromEntries(new FormData(form));const id=raw.empresa_id;delete raw.empresa_id;for(const key of ['access_token','app_secret','verify_token'])if(!raw[key])delete raw[key];await api('/empresas/'+id+'/credenciales',{method:'PUT',body:JSON.stringify(raw)});document.querySelector('#credentials').close();load()};
document.querySelector('#logoutButton').onclick=async event=>{if(!confirm('¿Cerrar la sesión actual?'))return;const button=event.currentTarget;button.disabled=true;button.textContent='Cerrando…';try{await api('/logout',{method:'POST'});location.href=BASE+'/'}catch(e){alert('No se pudo cerrar la sesión: '+e.message);button.disabled=false;button.textContent='Cerrar sesión'}};
load().catch(e=>companies.textContent=e.message);
</script>
</body></html>
