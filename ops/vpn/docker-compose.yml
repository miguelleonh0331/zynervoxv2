name: zynervoxv2-vpn
services:
  openvpn:
    build: .
    image: zynervoxv2-openvpn-admin:local
    container_name: zynervoxv2-openvpn
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    sysctls:
      net.ipv4.ip_forward: '1'
    environment:
      VPN_PUBLIC_IP: '192.168.3.22'
      VPN_PROTO: udp
      VPN_PORT: '1194'
      VPN_CLIENT_NAME: bootstrap
      VPN_DISABLE_USAGE_COUNTS: '1'
    ports:
      - '192.168.3.22:1194:1194/udp'
      - '127.0.0.1:18081:8080/tcp'
    volumes:
      - vpn-data:/etc/openvpn
      - /opt/zynervoxv2-vpn/api-token:/run/secrets/vpn-token:ro,Z
    networks:
      - vpn
    healthcheck:
      test: ['CMD-SHELL', 'pidof openvpn-real >/dev/null && ip link show tun0 >/dev/null && test -S /run/zv-vpn-events.sock']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
volumes:
  vpn-data:
    name: zynervoxv2-vpn-data
networks:
  vpn:
    ipam:
      config:
        - subnet: 172.30.119.0/24
