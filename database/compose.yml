services:
  mariadb:
    image: mariadb:10.11
    container_name: zynervox-mariadb
    restart: unless-stopped
    env_file: .env
    environment:
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    ports:
      - "${DB_BIND:-127.0.0.1}:${DB_PORT:-3307}:3306"
    volumes:
      - zynervox_db:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h 127.0.0.1 -uroot -p$$MARIADB_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

volumes:
  zynervox_db:
    name: zynervox_mariadb_data
