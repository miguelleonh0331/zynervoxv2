services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    env_file: .env
    environment:
      MYSQL_DATABASE: ${ZYNERDESK_DB_NAME}
      MYSQL_USER: ${ZYNERDESK_DB_USER}
      MYSQL_PASSWORD: ${ZYNERDESK_DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${ZYNERDESK_DB_ROOT_PASSWORD}
    volumes:
      - zynerdesk_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  app:
    image: ${ZYNERDESK_IMAGE}
    restart: unless-stopped
    env_file: .env
    environment:
      HOST: 0.0.0.0
      PORT: 4011
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${ZYNERDESK_DB_NAME}
      DB_USER: ${ZYNERDESK_DB_USER}
      DB_PASS: ${ZYNERDESK_DB_PASSWORD}
      INITIAL_ADMIN_USER: ${ZYNERDESK_ADMIN_USER}
      INITIAL_ADMIN_PASSWORD: ${ZYNERDESK_ADMIN_PASSWORD}
      ZYNERVOX_SSO_SECRET: ${ZYNERVOX_SSO_SECRET}
      ZYNERVOX_SSO_ADMIN_USER: ${ZYNERDESK_ADMIN_USER}
      COOKIE_SECURE: ${ZYNERDESK_COOKIE_SECURE:-0}
      COOKIE_SAME_SITE: ${ZYNERDESK_COOKIE_SAME_SITE:-Lax}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:4011/login.html',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    ports:
      - "${ZYNERDESK_BIND_HOST}:${ZYNERDESK_PORT}:4011"
    volumes:
      - zynerdesk_data:/app/data

volumes:
  zynerdesk_mysql:
  zynerdesk_data:
