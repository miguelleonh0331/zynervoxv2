<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Visor</title>
  <style>
    * { box-sizing:border-box; }
    html,body { margin:0; height:100%; background:#000; font-family:"Segoe UI",sans-serif; color:#e8eef4; }
    body { display:flex; }
    .stage { position:relative; flex:1; background:#000; min-height:0; }
    video { width:100%; height:100%; display:block; background:#000; object-fit:contain; }
    .hint { position:absolute; left:10px; bottom:10px; background:rgba(0,0,0,.55); color:#cfe; padding:5px 9px; border-radius:6px; font-size:12px; pointer-events:none; }
  </style>
</head>
<body>
  <!-- Visor puro (solo imagen). Sin barra, sin titulo, sin control. -->
  <div class="stage">
    <video id="video" autoplay playsinline muted></video>
    <div class="hint" id="hint">Esperando video&hellip;</div>
  </div>
  <script>
    const Q = new URLSearchParams(location.search);
    const AGENT = Q.get("agent") || "";
    const BASE = location.pathname.replace(/[^/]*$/, "");
    const WS_URL = (location.protocol === "https:" ? "wss:" : "ws:") + "//" + location.host + BASE + "ws";
    const STUN = [{ urls: "stun:stun.l.google.com:19302" }];
    const el = (i) => document.getElementById(i);
    const R = { ws:null, pc:null };

    function connect() {
      R.ws = new WebSocket(WS_URL);
      R.ws.onopen = () => R.ws.send(JSON.stringify({ type:"session:join", agentId:AGENT }));
      R.ws.onclose = () => { const h = el("hint"); if (h && !el("video").srcObject) h.textContent = "desconectado"; };
      R.ws.onmessage = async (ev) => {
        const msg = JSON.parse(ev.data);
        if (msg.type === "agent:offline") { el("hint").textContent = "El agente no está conectado."; return; }
        if (msg.type === "webrtc:offer") {
          R.pc = new RTCPeerConnection({ iceServers: STUN });
          R.pc.ontrack = (t) => {
            el("video").srcObject = t.streams[0];
            el("video").play().catch(()=>{});
            const h = el("hint"); if (h) h.style.display = "none";
          };
          R.pc.onicecandidate = (c) => { if (c.candidate) R.ws.send(JSON.stringify({ type:"webrtc:ice-candidate", agentId:AGENT, candidate:c.candidate })); };
          await R.pc.setRemoteDescription(msg.offer);
          const ans = await R.pc.createAnswer();
          await R.pc.setLocalDescription(ans);
          R.ws.send(JSON.stringify({ type:"webrtc:answer", agentId:AGENT, answer:ans }));
        }
        if (msg.type === "webrtc:ice-candidate" && R.pc && msg.candidate) { R.pc.addIceCandidate(msg.candidate).catch(()=>{}); }
      };
    }

    if (!AGENT) { el("hint").textContent = "falta agentId"; } else connect();
    window.addEventListener("beforeunload", () => { try { R.pc && R.pc.close(); } catch {} try { R.ws && R.ws.close(); } catch {} });
  </script>
</body>
</html>
