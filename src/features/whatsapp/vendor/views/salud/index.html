<!doctype html><html lang="es"><head>
<base href="__APP_BASE__/"><script>window.__APP_BASE__='__APP_BASE__';</script>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Salud Meta · ZynerWABA</title><link rel="icon" href="zynervox.png">
<style>
:root{--bg:#f3f5f8;--ink:#30313c;--muted:#68707d;--brand:#f58a1f;--green:#168447;--amber:#b77700;--red:#c62828;--gray:#78808d}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Segoe UI,Arial,sans-serif}header{background:#30313c;color:#fff;padding:14px 22px;display:flex;align-items:center;gap:12px}header img{height:28px}header h1{font-size:16px;margin:0}header a{margin-left:auto;color:#fff;text-decoration:none;border:1px solid #ffffff55;padding:7px 12px;border-radius:8px}main{max-width:1180px;margin:20px auto;padding:0 18px}.toolbar{display:flex;align-items:center;gap:10px;margin-bottom:16px}.toolbar h2{margin:0;flex:1}.toolbar button,.card button{border:0;border-radius:8px;background:var(--brand);color:#fff;padding:9px 13px;font-weight:700;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:15px}.card{background:#fff;border-radius:14px;padding:17px;box-shadow:0 1px 4px #0001;border-top:5px solid var(--gray)}.card.verde{border-color:var(--green)}.card.ambar{border-color:var(--amber)}.card.rojo{border-color:var(--red)}.signal{font-size:31px}.head{display:flex;align-items:center;gap:9px}.head strong{font-size:16px}.badge{margin-left:auto;border-radius:20px;padding:4px 8px;font-size:11px;font-weight:800;background:#eef0f3}.motivo{min-height:38px;font-size:13px;line-height:1.45}.meta{display:grid;grid-template-columns:1fr 1fr;gap:7px;font-size:12px}.meta div{background:#f7f8fa;border-radius:8px;padding:8px}.meta b{display:block;font-size:14px;word-break:break-word}.muted{color:var(--muted);font-size:12px}.spark{display:flex;align-items:end;gap:3px;height:32px;margin-top:10px}.spark button{flex:1;min-width:3px;border:0;padding:0;border-radius:2px;background:var(--gray);height:8px;cursor:pointer}.spark button:hover,.spark button:focus{outline:2px solid #30313c;outline-offset:2px}.spark button.verde{background:var(--green);height:12px}.spark button.ambar{background:var(--amber);height:21px}.spark button.rojo{background:var(--red);height:30px}.trend-help{margin:4px 0 0}.alerts{margin-bottom:16px}.alert{background:#fff;border-left:5px solid var(--amber);padding:11px 13px;margin:7px 0;border-radius:8px;display:flex;gap:10px;align-items:center}.alert.critico{border-color:var(--red)}.alert span{flex:1}.empty{background:#fff;border-radius:12px;padding:22px;color:var(--muted)}.error{color:var(--red)}dialog{border:0;border-radius:14px;padding:20px;max-width:430px;width:calc(100% - 36px);color:var(--ink);box-shadow:0 16px 50px #0005}dialog::backdrop{background:#0008}.detail-grid{display:grid;gap:9px;margin:15px 0}.detail-grid div{background:#f4f6f8;border-radius:8px;padding:9px}.detail-grid b{display:block;margin-top:3px}dialog button{border:0;border-radius:8px;background:var(--brand);color:#fff;padding:9px 13px;font-weight:700;cursor:pointer}
</style></head><body>
<header><img src="zynervox.png" alt="ZynerWABA"><h1>Salud oficial de Meta</h1><a href="">← Volver</a></header>
<main><div class="toolbar"><h2 id="title">Calidad de números</h2><button id="poll">Consultar Meta ahora</button></div><div id="message" class="muted"></div><section id="alerts" class="alerts"></section><section id="grid" class="grid"><div class="empty">Cargando…</div></section></main>
<dialog id="measurement"><h3>Detalle del sondeo</h3><div class="detail-grid"><div>Fecha y hora local<b id="detailDate"></b></div><div>Estado<b id="detailState"></b></div><div>Calidad Meta<b id="detailQuality"></b></div><div>Motivo<b id="detailReason"></b></div></div><button id="closeMeasurement">Cerrar</button></dialog>
<script src="socket.io/socket.io.js"></script><script>
const BASE=window.__APP_BASE__,$=s=>document.querySelector(s),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let isSuper=false;
async function api(path,options={}){const r=await fetch(BASE+'/api'+path,{headers:{'Content-Type':'application/json'},...options}),d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'Error de servidor');return d}
const icon=s=>s==='verde'?'🟢':s==='ambar'?'🟡':s==='rojo'?'🔴':'⚪';
const measurements=new Map();
function localDate(value){if(!value)return 'Sin fecha';const date=new Date(String(value).replace(' ','T')+'Z');return Number.isNaN(date.getTime())?String(value):date.toLocaleString([], {year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit'})}
function spark(history,phoneNumberId){const recent=history.slice(-30);return `<div class="spark" aria-label="Últimos ${recent.length} sondeos">${recent.map((x,index)=>{const key=`${phoneNumberId}:${index}`;measurements.set(key,x);const label=`${localDate(x.created_at)} · ${String(x.quality_rating||'UNKNOWN')} · ${String(x.motivo||'Sin motivo')}`;return `<button type="button" class="${esc(x.semaforo)}" data-measurement="${esc(key)}" title="${esc(label)}" aria-label="${esc(label)}"></button>`}).join('')}</div><p class="muted trend-help">Últimos ${recent.length} sondeos · pasa el cursor o pulsa una barra para ver fecha y detalle.</p>`}
async function loadAlerts(){if(isSuper){$('#alerts').innerHTML='';return}const rows=await api('/salud/alertas');$('#alerts').innerHTML=rows.map(a=>`<div class="alert ${esc(a.severidad)}"><span><b>${a.severidad==='critico'?'Acción urgente':'Revisar'}:</b> ${esc(a.mensaje)}</span><button data-resolve="${a.id}">Atendida</button></div>`).join('')}
async function load(){try{const rows=await api(isSuper?'/salud/global':'/salud');$('#title').textContent=isSuper?'Calidad Meta global':'Calidad Meta de mis números';const histories=new Map();measurements.clear();if(!isSuper)await Promise.all(rows.map(async r=>histories.set(r.phone_number_id,await api('/salud/'+r.phone_number_id))));$('#grid').innerHTML=rows.length?rows.map(r=>`<article class="card ${esc(r.semaforo)}"><div class="head"><span class="signal">${icon(r.semaforo)}</span><div><strong>${esc(r.line_name||r.display_phone_number||r.phone_number_id)}</strong><div class="muted">${isSuper?esc(r.empresa_nombre)+' · ':''}${esc(r.display_phone_number||r.phone_number_id)}</div></div><span class="badge">${esc(r.quality_rating||'UNKNOWN')}</span></div><p class="motivo">${esc(r.motivo)}</p><div class="meta"><div>Nombre verificado<b>${esc(r.verified_name||'—')}</b></div><div>Estado del número<b>${esc(r.meta_status||'—')}</b></div><div>Estado del nombre<b>${esc(r.name_status||'—')}</b></div><div>Verificación de código<b>${esc(r.code_verification_status||'—')}</b></div><div>Tier de mensajería<b>${esc(r.messaging_limit_tier||'—')}</b></div><div>Throughput<b>${esc(r.throughput||'—')}</b></div><div>Plataforma<b>${esc(r.platform_type||'—')}</b></div><div>Conexión Meta<b>${r.token_ok?'Válida':'Error'}</b></div></div>${isSuper?'':spark(histories.get(r.phone_number_id)||[],r.phone_number_id)}<p class="muted">Consultado: ${esc(localDate(r.created_at))}</p></article>`).join(''):'<div class="empty">Todavía no hay consultas a Meta. Pulsa “Consultar Meta ahora”.</div>';await loadAlerts();$('#message').textContent=''}catch(e){$('#message').innerHTML='<span class="error">'+esc(e.message)+'</span>'}}
$('#poll').onclick=async()=>{try{$('#poll').disabled=true;$('#message').textContent='Consultando Meta…';await api('/salud/sondear',{method:'POST'});await load()}catch(e){$('#message').innerHTML='<span class="error">'+esc(e.message)+'</span>'}finally{$('#poll').disabled=false}};
$('#alerts').onclick=async e=>{const b=e.target.closest('[data-resolve]');if(!b)return;await api('/salud/alertas/'+b.dataset.resolve+'/resolver',{method:'POST'});await loadAlerts()};
$('#grid').onclick=e=>{const bar=e.target.closest('[data-measurement]');if(!bar)return;const row=measurements.get(bar.dataset.measurement);if(!row)return;$('#detailDate').textContent=localDate(row.created_at);$('#detailState').textContent=String(row.semaforo||'sin_datos').toUpperCase();$('#detailQuality').textContent=row.quality_rating||'UNKNOWN';$('#detailReason').textContent=row.motivo||'Sin motivo';$('#measurement').showModal()};
$('#closeMeasurement').onclick=()=>$('#measurement').close();
(async()=>{const me=(await api('/me')).user;if(!me){location.href=BASE+'/';return}isSuper=me.role==='superadmin';if(isSuper)$('#poll').style.display='none';const socket=io({path:BASE+'/socket.io'});socket.on('salud:alerta',load);await load()})();
</script></body></html>
